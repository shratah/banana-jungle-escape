<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Jungle Escape</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

    <div class="game-container" id="gameBox">
        <h1>🍌 Banana Escape</h1>
        <a href="minigame.html" style="display:block; margin-bottom: 20px; color: #f1c40f; text-decoration: none; font-weight: bold;">🃏 Play Mini-Game (Earn Coins/Lives)</a>

        <div class="stats">
            <p>🪙 Coins: <span id="coinCount">0</span></p>
            <p>❤️ Lives: <span id="lives">3</span></p>
            <p>🍌 Bananas: <span id="bananaCount">0</span> / 10</p>
        </div>

        <div class="image-container">
            <span class="loader" id="loader"></span>
            <img id="bananaImage" src="" alt="Banana Puzzle" style="display: none;">
        </div>

        <div class="input-group">
            <input type="number" id="answer" placeholder="Enter solution" onkeypress="handleKeyPress(event)">
            <button onclick="checkAnswer()">Submit</button>
        </div>
    </div>

    <!-- Container for dynamic toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/game.js"></script>
</body>
</html>
