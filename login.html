<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Banana Jungle Escape</title>
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- Dynamic Background Animation Container -->
<div class="background-animation" id="bg-animation"></div>

<div class="login-container">
    <div class="icon-container">
        🍌
    </div>
    <h2>Jungle Login</h2>
    
    <form action="login.php" method="POST" id="loginForm">
        <div class="input-group">
            <input type="email" name="email" id="email" required placeholder=" ">
            <label for="email">Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" id="password" required placeholder=" ">
            <label for="password">Password</label>
        </div>

        <button type="submit" name="login" id="loginBtn">Enter the Jungle</button>
    </form>

    <!-- Google Login Button -->
    <div style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center;">
        <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
            data-type="standard"
            data-shape="rectangular"
            data-theme="outline"
            data-text="signin_with"
            data-size="large"
            data-logo_alignment="left">
        </div>
    </div>
    
    <p class="register-link">Don't have an account? <a href="register.php">Register Here</a></p>
</div>

<script src="js/login.js"></script>

</body>
</html>
