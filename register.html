<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Banana Jungle Escape</title>
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<!-- Dynamic Background Animation Container -->
<div class="background-animation" id="bg-animation"></div>

<div class="register-container">
    <div class="icon-container">
        🌴
    </div>
    <h2>Join the Jungle</h2>
    
    <form id="registerForm" action="register.php" method="POST">
        <div class="input-group">
            <input type="text" name="username" id="username" required placeholder=" ">
            <label for="username">Explorer Name (Username)</label>
        </div>

        <div class="input-group">
            <input type="email" name="email" id="email" required placeholder=" ">
            <label for="email">Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" id="password" required placeholder=" ">
            <label for="password">Secret Password</label>
        </div>

        <button type="submit" name="register" id="registerBtn">Start Expedition</button>
    </form>
    
    <p class="login-link">Already an explorer? <a href="login.html">Login Here</a></p>
</div>

<script src="js/register.js"></script>

</body>
</html>
